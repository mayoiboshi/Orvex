name: orvex
description: A personal cross-platform video player.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  file_selector: ^1.1.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  package_info_plus: 10.2.2
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/brand/orbit-mark.png
    - assets/metadata/bangumi-data.json
    - assets/metadata/bangumi-data-manifest.json
    - assets/fonts/NotoSansCJKsc-Regular.otf
    - assets/fonts/NotoSansCJK-OFL.txt
    - test/fixtures/generated.mp4
    - test/fixtures/sample.srt
    - test/fixtures/sample.ass
